body:
  text: 卷上一難一難曰十二經中皆有動脈獨取寸口以決五臟六腑死生吉凶之法何謂也然寸口者脈之大會手太陰之動脈也難問難也難經者問難黃帝內經之義也黃帝咨岐伯作素問靈樞經謂之內經十二經中皆有動脈手太陰脈動中府雲門天府俠白手陽明脈動合谷陽溪手少陰脈動極泉神門手太陽脈動天窗手厥陰脈動勞宮手少陽脈動禾髎足太陰脈動箕門衝門足陽明脈動大迎人迎氣街衝陽足少陰脈動太溪陰谷足太陽脈動委中足厥陰脈動太衝五里陰廉足少陽脈動聽會頷厭皆穴名然答語辭寸口者脈之大會以肺主氣十二經之脈動肺氣鼓之也故肺朝百脈十二經脈皆朝宗於肺而大會於寸口寸口者氣口成寸以決死生素問經脈別論語故曰寸口氣口即寸口也寸口三部魚際為寸太淵為關經渠為尺皆穴名是手太陰肺經之動脈也四十五難脈會太淵亦是此義人一呼脈行三寸一吸脈行三寸呼吸定息脈行六寸人一日一夜凡一萬三千五百息脈行五十度周於身漏水下百刻營衛行陽二十五度行陰亦二十五度為一周也故五十度復會於手太陰寸口者五臟六腑之所終始故法取於寸口也靈樞五十營漏水下百刻以分晝夜人一呼脈再動氣行三寸一吸脈亦再動氣行三寸呼吸定息氣行六寸十息氣行六尺二百七十息氣行十六丈二尺氣行一周於身下水二刻二千七百息氣行十周於身下水二十刻一萬三千五百息氣行五十營於身水下百刻凡行八百一十丈靈樞營衛生會人受氣於谷谷入於胃以傳於肺其清者為營濁者為衛營在脈中衛在脈外營周不休五十而復大會衛與營俱行於陽二十五度手足六陽行於陰亦二十五度手足六陰一周也故五十度而復大會於手太陰矣會於手太陰之寸口經脈一日五十周今日平旦始於手太陰之寸口明日平旦又會於手太陰之寸口此五臟六腑之所終始故法取於寸口也會寸口者營氣也故氣口成寸以決死生但言營氣若衛氣則今日平旦始於足太陽之睛明明日平旦又會於睛明不會於寸口也二難二難曰脈有尺寸何謂也然尺寸者脈之大要會也從關至尺是尺內陰之所治也從關至魚際是寸口內陽之所治也故分寸為尺分尺為寸故陰得尺中一寸陽得寸內九分尺寸始終一寸九分故曰尺寸也寸口者脈之大要會言是經脈中絶大之要會也尺中主陰寸口主陽關上陰陽之中分也分寸為尺者分一尺之一寸為尺也分尺為寸者分一尺之九為寸也陰得尺中之一寸曰尺者以一寸為一尺也陽得寸內之九分曰寸者以一分為一寸也其實尺寸始終止得一寸九分而已三難三難曰脈有太過有不及有陰陽相乘有覆有溢有關有格何謂也然關之前者陽之動也脈當見九分而浮過者法曰太過減者法曰不及遂上魚為溢為外關內格此陰乘之脈也關以後者陰之動也脈當見一寸而沉過者法曰太過減者法曰不及遂入尺為覆為內關外格此陽乘之脈也故曰覆溢是其真臟之脈人不病而死也掌內手大指根豐肉曰魚關前為陽脈當見九分而浮遂上魚為溢此不止九分而浮亦乖常是陽脈之太過者為外關內格此陰乘陽位之脈也關後為陰脈當見一寸而沉遂入尺為覆此不止一寸而沉亦殊恆是陰脈之太過者為內關外格此陽乘陰位之脈也外關內格者陰格於內而陽關於外也內關外格者陽格於外而陰關於內也溢者如水之滿溢也覆者如牆之傾覆也真臟之脈胃氣絶也義詳素問玉機真臟靈樞終始人迎四盛且大且數名曰溢陽溢陽為外格外格不通死不治寸口四盛且大且數名曰溢陰溢陰為內關內關不通死不治義與此異四難四難曰脈有陰陽之法何謂也然呼出心與肺吸入腎與肝呼吸之間脾受穀味也其脈在中浮者陽也沉者陰也故曰陰陽也陽浮而陰沉心肺為陽故呼出者心肺之氣也腎肝為陰故吸入者腎肝之氣也呼吸之間不浮不沉其應在脾是脾之受穀味而在中者也心肺俱浮何以別之然浮而大散者心也浮而短澀者肺也肝腎俱沉何以別之然牢而長者肝也按之而濡舉指來實者腎也脾主中州故其脈在中是陰陽之法也心肺俱浮而心則大散肺則短澀是肺脈浮而微沉也肝腎俱沉而腎則濡實肝則牢長是肝脈沉而微浮也脈有一陰一陽一陰二陽一陰三陽有一陽一陰一陽二陰一陽三陰如此之言寸口有六脈俱動耶然此言者非有六脈俱動也謂浮沉長短滑澀也浮者陽也滑者陽也長者陽也沉者陰也短者陰也澀者陰也所謂一陰一陽者謂脈來沉而滑也一陰二陽者謂脈來沉滑而長也一陰三陽者謂脈來浮滑而長時一沉也所謂一陽一陰者謂脈來浮而澀也一陽二陰者謂脈來長而沉澀也一陽三陰者謂脈來沉澀而短時一浮也各以其經所在名病逆順也各以其經所在名病逆順左寸候心右寸候肺兩關候肝脾兩尺候腎也五難五難曰脈有輕重何謂也然初持脈如三菽之重與皮毛相得者肺部也如六菽之重與血脈相得者心部也如九菽之重與肌肉相得者脾部也如十二菽之重與筋平者肝部也按之至骨舉指來疾者腎部也故曰輕重也肺主皮心主脈脾主肉肝主筋腎主骨故其脈各見其部菽豆也六難六難曰脈有陰盛陽虛陽盛陰虛何謂也然浮之損小沉之實大故曰陰盛陽虛沉之損小浮之實大故曰陽盛陰虛是陰陽虛實之意也陰位於里其脈沉陽位於表其脈浮七難七難曰經言少陽之至乍大乍小乍短乍長陽明之至浮大而短太陽之至洪大而長太陰之至緊大而長少陰之至緊細而微厥陰之至沉短而敦此六者是平脈也將病脈耶然皆王脈也經內經素問著至教論太陽脈至洪大以長少陽脈至乍數乍疏乍短乍長陽明脈至浮大而短舊誤在平人氣象論王脈脈之得令而氣王也其氣以何月各王幾日然冬至後得甲子少陽王復得甲子陽明王復得甲子太陽王復得甲子太陰王復得甲子少陰王復得甲子厥陰王王各六十日六六三百六十日以成一歲此三陰三陽之王時日大要也一歲三百六十日六氣分王各六十日冬至子半陽生始得甲子三陽當令夏至午半陰生始得甲子三陰司氣日六竟而周甲甲六復而終歲素問六節臟象論語六氣分王六甲而終一歲一定之數也八難八難曰寸口脈平而死者何謂也然諸十二經脈者皆繫於生氣之原所謂生氣之原者謂十二經之根本也謂腎間動氣也此五臟六腑之本十二經脈之根呼吸之門三焦之原一名守邪之神故氣者人之根本也根絶則莖葉枯矣寸口脈平而死者生氣獨絶於內也氣根於水腎間動氣是謂人身生氣之原五臟六腑之本十二經脈之根呼吸之門三焦之原一名守邪之神此氣者人之根本譬之樹木根絶則莖葉枯矣寸口脈平而人死者水中生氣獨絶於內也守邪之神保固真氣捍禦外邪也九難九難曰何以別知臟腑之病然數者腑也遲者臟也數則為熱遲則為寒諸陽為熱諸陰為寒故以別知臟腑之病也腑脈數臟脈遲數為熱遲為寒十難十難曰一脈十變者何謂也然五邪剛柔相逢之意也假令心脈急甚者肝邪干心也心脈微急者膽邪干小腸也心脈大甚者心邪自干心也心脈微大者小腸邪自干小腸也心脈緩甚者脾邪干心也心脈微緩者胃邪干小腸也心脈澀甚者肺邪干心也心脈微澀者大腸邪干小腸也心脈沉甚者腎邪干心也心脈微沉者膀胱邪干小腸也五臟各有剛柔邪故令一脈輒變為十也一脈十變義見靈樞邪氣臟腑病形論五邪五臟五腑之邪剛柔臟邪剛腑邪柔肝脈急肝合膽心脈大心合小腸脾脈緩脾合胃肺脈澀肺合大腸腎脈沉腎合膀胱剛則脈甚柔則脈微臟腑之邪各五二五為十故令一脈變為十也此候小腸與心脈即候心小腸於左寸肺大腸於右寸之法也大小腸腑雖至濁而其經自手走頭乃六陽中之至清者故可候於兩寸後世庸愚乃欲候二腸於兩尺狂妄極矣十一難十一難曰經言脈不滿五十動而一止一臟無氣者何臟也然人吸者隨陰入呼者因陽出今吸不能至腎至肝而還故知一臟無氣者腎氣先盡也經靈樞五十營五十動而不一代者五臟皆受氣四十動一代者一臟無氣三十動一代者二臟無氣二十動一代者三臟無氣十動一代者四臟無氣不滿十動一代者五臟無氣人吸者隨陰入呼者因陽出今吸不能至腎至肝而還則五十動中必見代止故知一臟無氣者腎氣先盡也由腎而肝由肝而脾由脾而心由心而肺其次第也十二難十二難曰經言五臟脈已絶於內用針者反實其外五臟脈已絶於外用針者反實其內內外之絶何以別之然五臟脈已絶於內者腎肝脈絶於內也而醫反補其心肺五臟脈已絶於外者心肺脈絶於外也而醫反補其腎肝陽絶補陰陰絶補陽是謂實實虛虛損不足而補有餘如此死者醫殺之耳經靈樞九針十二原五臟之氣已絶於內而用針者反實其外是謂重竭重竭則必死其死也靜五臟之氣已絶於外而用針者反實其內是謂逆厥逆厥則必死其死也躁肝腎為陰心肺為陽陽在外陰在內絶於內者腎肝之氣也絶於外者心肺之氣也十三難十三難曰經言見其色而不得其脈反得相勝之脈者即死得相生之脈者病即自已色之與脈當參相應為之奈何然五臟有五色皆見於面亦當與寸口尺內相應假令色青其脈當弦而急色赤其脈浮大而散色黃其脈中緩而大色白其脈浮澀而短色黑其脈沉濡而滑此所謂五色之與脈當參相應也經靈樞邪氣臟腑病形色青者其脈弦赤者其脈鉤黃者其脈代白者其脈毛黑者其脈石見其色而不得其脈反得其相勝之脈則死矣得其相生之脈則病已矣濡軟同脈數尺之皮膚亦數脈急尺之皮膚亦急脈緩尺之皮膚亦緩脈澀尺之皮膚亦澀脈滑尺之皮膚亦滑此段靈樞邪氣臟腑病形文五臟各有聲色臭味當與寸口尺內相應其不應者病也假令色青其脈浮澀而短若大而緩為相勝浮大而散若小而滑為相生也經言知一為下工知二為中工知三為上工上工者十全九中工者十全八下工者十全六此之謂也肝木色青浮澀而短肺脈勝肝者也大而緩脾脈肝所勝也浮大而散心脈肝所生也小而滑腎脈生肝者也經言知一為下工六語亦邪氣臟腑病形文十四難十四難曰脈有損至何謂也然一呼再至曰平三至曰離經四至曰奪精五至曰死六至曰命絶此至之脈也何謂損然一呼一至曰離經二呼一至曰奪精三呼一至曰死四呼一至曰絶命此損之脈也至脈從下上損脈從上下也至脈從下上自下而升也損脈從上下自上而降也損脈之為病奈何然一損損於皮毛皮聚而毛落二損損於血脈血脈虛少不能榮於五臟六腑也三損損於肌肉肌肉消瘦飲食不能為肌膚四損損於筋筋緩不能自收持五損損於骨骨痿不能起於床反此者至脈之病也從上下者骨痿不能起於床者死從下上者皮聚而毛落者死肺主皮毛心主血脈脾主肌肉肝主筋腎主骨損脈從上下骨痿不起者自肺而之腎也至脈從下上皮聚毛落者自腎而之肺也治損之法奈何然損其肺者益其氣損其心者調其營衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精此治損之法也肝病者木鬱土賊腹滿裡急故宜緩其中脈有一呼再至一吸再至有一呼三至一吸三至有一呼四至一吸四至有一呼五至一吸五至有一呼六至一吸六至有一呼一至一吸一至有再呼一至再吸一至脈來如此何以別知其病也損至之脈有輕重則病亦不同應有分別之法然脈來一呼再至一吸再至不大不小曰平一呼三至一吸三至為適得病前大後小即頭痛目眩前小後大即胸滿短氣一呼四至一吸四至病欲甚脈洪大者苦煩滿沉細者腹中痛滑者傷熱澀者中霧露一呼五至一吸五至其人當困沉細夜加浮大晝加不大不小雖困可治其有大小者為難治一呼六至一吸六至為死脈也沉細夜死浮大晝死前謂寸後謂尺寸大尺小濁氣上逆故頭痛目眩寸小尺大清氣下陷肝脾不升則肺胃不降故胸滿短氣脈洪大者苦煩滿膽胃上逆而火升也膽木化氣相火沉細者腹中痛肝脾下陷而木賊也滑者傷熱溫氣內鬱而肝病也澀者中霧露寒氣外襲而肺病也夜為陰晝為陽沉細陰盛故夜加浮大陽盛故晝加甚者則死也一呼一至一吸一至名曰損人雖能行猶當著床所以然者血氣皆不足故也再呼一至再吸一至名曰無魂無魂者當死也人雖能行名曰行尸無魂魂絶而神敗也上部有脈下部無脈其人當吐不吐者死上部無脈下部有脈雖困無能為害所以然者人之有尺譬如樹之有根枝葉雖枯槁根本將自生脈有根本人有元氣故知不死飲食不消停蓄中脘陽遏不降故上部有脈下部無脈當吐之則愈若非吐證而見此脈者是根本敗竭法主死也十五難十五難曰經言春脈弦夏脈鉤秋脈毛冬脈石是王脈耶將病脈也然弦鉤毛石者四時之脈春脈弦者肝東方木也萬物始生未有枝葉故其脈之來濡弱而長故曰弦夏脈鉤者心南方火也萬物之所茂垂枝布葉皆下曲如鉤故其脈之來來疾去遲故曰鉤秋脈毛者肺西方金也萬物之所終草木花葉皆秋而落其枝獨在若毫毛也故其脈之來輕虛以浮故曰毛冬脈石者腎北方水也萬物之所藏也極冬之時水凝如石故其脈之來沉濡而滑故曰石此四時之脈也經素問玉機真臟論如有變奈何然春脈弦反者為病何謂反然其氣來實強是謂太過病在外氣來虛微是謂不及病在內脈來厭厭聶聶如循榆葉曰平益實而滑如循長竿曰病急而徑益強如新張弓弦曰死春脈微弦曰平弦多胃氣少曰病但弦無胃氣曰死春以胃氣為本素問平人氣象論平肺脈來厭厭聶聶如落榆莢曰肺平夏脈鈞反者為病何謂反然氣來實強是謂太過病在外氣來虛微是謂不及病在內脈來纍纍如環如循琅玕曰平來而益數如雞舉足曰病前曲後居如操帶鉤曰死夏脈微鉤曰平鉤多胃氣少曰病但鉤無胃氣曰死夏以胃氣為本平人氣象論實而益數如雞舉足曰脾病秋脈毛反者為病何謂反然其氣來實強是謂太過病在外氣來虛微是謂不及病在內其脈來藹藹如車蓋按之益大曰平不上不下如循雞羽曰病按之蕭索如風吹毛曰死秋脈微毛曰平毛多胃氣少曰病但毛無胃氣曰死秋以胃氣為本仲景脈法脈藹藹如車蓋者名曰陽結也冬脈石反者為病何謂反然氣來實強是謂太過病在外氣來虛微是謂不及病在內脈來上大下兌濡滑如雀之喙曰平啄啄連屬其中微曲曰病來如解索去如彈石曰死冬脈微石曰平石多胃氣少曰病但石無胃氣曰死冬以胃氣為本平人氣象論鋭堅如烏之喙曰脾死喘喘連屬其中微曲曰心病胃者水穀之海主稟四時皆以胃氣為本是謂四時之變病生死之要會也脾者中州也其平和不可得見衰乃見耳來如雀之喙如水之下漏是脾衰之見也主稟四時四時所稟也此篇引玉機真臟平人氣象二論而語微顛倒十六難十六難曰脈有三部九候有陰陽有輕重有六十首一脈變為四時離聖久遠各自是其法何以別之然是其病有內外證三部九候見十八難陰陽見四難輕重見五難六十首素問方盛衰論聖人持診之道先後陰陽而持之奇恆之勢乃六十首蓋上古診法也一脈變為四時即十五難春弦夏鉤秋毛冬石也脈法不一離聖久遠人各自是其法何以別其是非長短也是其病有內外證言凡病但以內外之證驗之自得其真不必拘拘於諸法也其病為之奈何然假令得肝脈其外證善潔面青善怒其內證臍左有動氣按之牢若痛其病滿閉溲便難四肢轉筋有是者肝也無是者非也肝脈弦其色青其志怒凡物稍不如意則怒生是為善潔其位在臍左其主筋其性疏泄風木鬱遏疏泄不行則腹滿便閉前後皆阻四肢轉筋也假令得心脈其外證面赤口乾善笑其內證臍上有動氣按之牢若痛其病煩心心痛掌中熱而啘有是者心也無是者非也心脈鉤其色赤其聲笑其位在臍上啘嘔而無物心煩作惡也假令得脾脈其外證面黃善噫善思善味其內證當臍上有動氣按之牢若痛其病腹脹滿食不消體重節痛怠惰嗜臥四肢不收有是者脾也無是者非也脾脈代脾脈緩隨四時更代弦鉤毛石之中而有緩象是即脾脈脾不主時也其色黃其志思其主味其位當臍其主四肢脾為太陰濕土濕旺脾郁不能消化水穀則腹滿食停脾郁腹滿則胃氣上逆而生噦噫體重節痛濕流關節怠惰嗜臥脾土困倦則欲臥眠四肢不收也假令得肺脈其外證面白善嚏悲愁不樂欲哭其內證臍右有動氣按之牢若痛其病喘咳灑淅寒熱有是者肺也無是者非也肺脈毛其色白其竅鼻肺氣逆沖出於鼻竅則為嚏其志悲其聲哭其位在臍右其藏氣肺氣阻逆則生喘咳其主皮毛皮毛感傷則生寒熱灑淅皮毛振悚假令得腎脈其外證色黑善恐缺其內證臍下有動氣按之牢若痛其病逆氣小腹急痛泄而下重足脛寒而逆有是者腎也無是者非也腎脈石其色黑其志恐其性蟄藏日暮陰隆腎氣上引陽將蟄而未蟄陰引而下陽引而上則為缺缺者開口呵氣也其位在臍下木生於水水寒不能生木甲木上拔則病逆氣乙木下衝則小腹急痛泄而下重其主骨髓骨髓失溫則足脛寒逆也十七難十七難曰經言病或有死或有不治自愈或連年月不已其生死存亡可切脈而知之耶然可盡知也經素問脈要精微平人氣象諸論診病若閉目不欲見人者脈當得肝脈強急而長而反得肺脈浮短而澀者死也肝竅於目閉目不欲見人肝木陷也故當得肝脈而反得肺脈者死金剋木也病若開目而渴心下牢者脈當得緊實而數而反得沉濡而微者死也肝膽同氣開目而渴心下牢者膽木上逆也故當得膽脈而反得腎脈者死膽木化氣於相火水剋火也病若吐血復鼽衄血者脈當沉細而反浮大而牢者死也鼽音求吐血衄血肺胃上逆收氣不行也而反得心脈者死火剋金也病若譫言妄語身當有熱脈當洪大而反手足厥冷脈沉細微者死也譫言妄語心火上炎也故身當有熱脈當洪大而反得腎脈者水剋火也水勝火熄而譫言者神敗也是以死病若大腹而泄者脈當微細而澀反緊大而滑者死也大腹而泄者脾土濕陷而木賊也微細而澀肺脈也而反得肝脈者死木剋土也十八難十八難曰脈有三部部有四經手有太陰陽明足有太陽少陰為上下部何謂也然手太陰陽明金也足少陰太陽水也金生水水流下行而不能上故在下部也足厥陰少陽木也生手太陽少陰火火炎上行而不能下故為上部手心主少陽火生足太陰陽明土土主中宮故在中部也此皆五行子母更相生養者也脈有三部寸關尺也部有四經兩寸心肺二腸兩關肝膽脾胃兩尺腎膀胱心主三焦也手太陰肺陽明大腸金也右寸生足少陰腎足太陽膀胱水左尺水流下行而不能上故在下部足厥陰肝少陽膽木也左關其實肝脾見於左關膽胃見於右關生手太陽小腸手少陰心火左寸火炎上行而不能下故為上部手心主包絡少陽三焦火也右尺生足太陰脾足陽明胃土右關土主中宮故在中部也脈有三部九候各何所主之然三部者寸關尺也九候者浮中沉也上部法天主胸以上至頭之有疾也中部法人主膈下至臍之有疾也下部法地主臍下至足之有疾也審而刺之者也素問三部九候法與此不同人病有沉滯久積聚可切脈而知之耶然診病在右脅有積聚得肺脈結脈結甚則疾甚結微則積微診不得肺脈而右脅有積氣者何也然肺脈雖不見右手脈沉伏其外痼疾同法耶將異也然結者脈來去時一止無常數名曰結也伏者脈行筋下也浮者脈在肉上行也左右表裡法皆如此假令脈結伏者內無積聚脈浮結者外無痼疾有積聚脈不結伏有痼疾脈不浮結而脈不應病病不應脈是為死病也臟病曰積腑病曰聚十九難十九難曰脈有逆順男女有恆而反者何謂也然男子生於寅寅為木陽也女子生於申申為金陰也故男脈在關上女脈在關下是以男子尺脈恆弱女子尺脈恆盛是其常也反者男得女脈女得男脈也男子生於寅女子生於申男一歲起丙寅順行二歲丁卯以陽生於子子至寅而三陽成也女一歲起壬申逆行二歲辛未以陰生於午午至申而三陰成也命家起小運法寅木生火火炎上故男脈在關上申金生水水流下故女脈在關下是以男子尺脈恆弱寸脈恆盛女子尺脈恆盛寸脈恆弱是其常也反者男得女脈寸弱而尺盛也女得男脈尺弱而寸盛也其為病何如然男得女脈為不足病在內左得之病在左右得之病在右隨脈言之也女得男脈為太過病在四肢左得之病在左右得之病在右隨脈言之此之謂也男得女脈以陽而變陰故為不足陰盛於內故病在內女得男脈以陰而變陽故為太過陽盛於四肢故病在四肢二十難二十難曰經言脈有伏匿伏匿於何臟而言伏匿耶然謂陰陽更相乘更相伏也脈居陰部而反陽脈見者為陽乘陰也脈雖時沉澀而短此謂陽中伏陰也脈居陽部而反陰脈見者為陰乘陽也脈雖時浮滑而長此謂陰中伏陽也陽脈而見陰來謂之陽中伏陰陰脈而見陽來謂之陰中伏陽重陽者狂重陰者癲脫陽者見鬼脫陰者目盲重陽者狂木火之陽旺也重陰者癲金水之陰旺也心主喜肝主怒狂者木火有餘故多喜怒腎主恐肺主悲癲者金水有餘故多悲恐脫陽者陰旺鬼陰類也故見之肝竅於目緣肝藏血血舍魂魂化神魂神升發而生光明上開雙竅則為兩目陰者陽之宅也陰脫宅傾神魂散亡是以目盲名曰脫陰而實脫陰中之陽氣也二十一難二十一難曰經言人形病脈不病曰生脈病形不病曰死何謂也然人形病脈不病非有不病者也謂息數不應脈數也此大法形病脈不病非有不病此以診者息數不調不應脈數也二十二難二十二難曰經言脈有是動有所生病一脈輒變為二病者何也然經言是動者氣也所生病者血也邪在氣氣為是動邪在血血為所生病經靈樞經脈也氣主詬之血主濡之氣留而不行者為氣先病也血滯而不濡者為血後病也故先為是動後所生也氣留則血滯故氣先病而血後病二十三難二十三難曰手足三陰三陽脈之度數可曉以不然手三陽之脈從手至頭長五尺五六合三丈手三陰之脈從手至胸中長三尺五寸三六一丈八尺五六三尺合二丈一尺足三陽之脈從足至頭長八尺六八四丈八尺足三陰之脈從足至胸長六尺五寸六六三丈六尺五六三尺合三丈九尺人兩足蹺脈從足至目長七尺五寸二七一丈四尺二五一尺合一丈五尺督脈任脈各長四尺五寸二四八尺二五一尺合九尺凡脈長一十六丈二尺此所謂經脈長短之數也此引靈樞脈度文經脈十二絡脈十五何始何窮也然經脈者行血氣通陰陽以榮於身者也其始從中焦注手太陰陽明陽明注足陽明太陰太陰注手少陰太陽太陽注足太陽少陰少陰注手心主少陽少陽注足少陽厥陰厥陰復還注手太陰別絡十五皆因其原如環無端轉相灌溉朝於寸口人迎以處百病而決死生也經脈十二相注之次見靈樞經脈別絡十五別走之道見靈樞經別絡脈之行皆與經脈同原而別交他經如環無端轉相灌溉而悉朝於寸口人迎人迎足陽明動脈在喉旁以處百病而決死生也經曰明知終始陰陽定矣何謂也然知終始者脈之紀也寸口人迎陰陽之氣通於朝使如環無端故曰始也終者三陰三陽之脈絶絶則死死各有形故曰終也靈樞終始凡刺之道畢於終始明知終始五臟為紀陰陽定矣朝朝宗也使使道也即經隧也三陰三陽之脈絶則死死各有形故曰終是謂十二經終詳見靈樞終始亦載素問診要經終二十四難二十四難曰手足三陰三陽氣已絶何以為候可知其吉凶否然足少陰氣絶則骨枯少陰者冬脈也伏行而溫於骨髓故骨髓不溫即肉不著骨骨肉不相親即肉濡而卻肉濡而卻故齒長而枯發無潤澤無潤澤者骨先死戊日篤己日死腎主骨其榮發戊篤己死土勝水也足太陰氣絶則脈不榮其口唇口唇者肌肉之本也脈不榮則肌肉不滑澤肌肉不滑澤則人中滿人中滿則唇反唇反則肉先死甲日篤乙日死脾主肉其榮唇甲篤乙死木勝土也人中滿舊訛作肉滿依靈樞改足厥陰氣絶則筋縮引卵與舌卷厥陰者肝脈也肝者筋之合也筋者聚於陰器而絡於舌本故脈不榮即筋縮急筋縮急即引卵與舌故舌卷卵縮此筋先死庚日篤辛日死肝主筋聚於陰器而終於舌本庚篤辛死金勝木也手太陰氣絶則皮毛焦太陰者肺也行氣溫於皮毛者也氣弗榮則皮毛焦皮毛焦則津液去津液去則皮節傷皮節傷則皮枯毛折毛折者則毛先死丙日篤丁日死肺主皮其榮毛丙篤丁死火勝金也手少陰氣絶則脈不通脈不通則血不流血不流則色澤去故面黑如黎此血先死壬日篤癸日死心主脈其榮色壬篤癸死水勝火也五陰氣俱絶則目眩轉轉則目瞑目瞑者為失志失志者則志先死志先死則遠一日半死矣五陰五臟之陰也五臟主藏五神目瞑不見神敗光失也六陽氣俱絶則陰與陽相離陰陽相離則腠理泄絶汗乃出大如貫珠轉出不流即氣先死旦占夕死夕占旦死六陽六腑之陽也陽主外衛陽亡表泄故出絶汗此篇全引靈樞病傳文舊誤在經脈中而字句微異其訛舛之甚者依靈樞正之二十五難二十五難曰有十二經五臟六腑十一耳其一經何等經也然一經者手少陰與心主別脈也心主與三焦為表裡俱有名而無形故言經有十二也心主手厥陰心包絡也與手少陽三焦為表裡二十六難二十六難曰三焦何稟何主何始何終其治常在何許可曉以不然三焦者水穀之道路氣之所終始也上焦者在心下下膈當胃上口主內而不出其治在膻中玉堂下一寸六分直兩乳間陷者是中焦者在胃中脘不上不下主腐熟水穀其治在臍旁下焦者在臍下當膀胱上口主分別清濁出而不內以傳導也其治在臍下一寸故名曰三焦其府在氣街膻中者素問十二臟相使膻中者臣使之官喜樂出焉靈樞脹論膻中者心主之宮城也膻中即心包所在玉堂任脈穴氣街足陽明穴其府在氣街府氣府也素問氣府論經絡腧穴氣之府也氣街氣之道路也靈樞標本胸氣有街腹氣有街頭氣有街脛氣有街蓋氣之所聚會曰府氣之所通達曰街足陽明臟腑之原多血多氣故獨有氣街之名三焦下腧並足太陽之經下行胸中出於委陽見靈樞本輸路由陽明之氣街在毛際兩旁是亦三焦之氣府也三焦之經為手少陽三焦相火生脾胃而化水穀全賴乎此故上焦主受納飲食中焦主腐化水穀下焦主傳輸便溺所謂決瀆之官水道出焉十二臟相使語緣其火足土燥蒸水化氣氣降水生注於膀胱而後水道能出也二十七難二十七難曰經有十二絡有十五餘三絡者是何等絡也然有陽絡有陰絡有脾之大絡陽絡者陽蹺之絡也陰絡者陰蹺之絡也故絡有十五焉十五絡見靈樞經別本以督脈之別任脈之別與脾之大絡合為十五不數陰陽二蹺與此不同二十八難二十八難曰脈有奇經八脈者不拘於十二經何謂也然有陽維有陰維有陽蹺有陰蹺有沖有督有任有帶之脈凡此八脈者皆不拘於經故曰奇經八脈也不拘於經不與經脈同行也經有十二絡有十五凡二十七氣相隨上下何獨不拘於經也然聖人圖設溝渠通利水道以備不然天雨下降溝渠滿溢當此之時雱霈妄行聖人不能復圖也此絡脈滿溢諸經不能復拘也十二經脈各有疆界自經脈而入奇經則經脈不能復拘譬之天雨下降溝渠滿溢雱霈妄行不拘井田分畫之舊制也二十九難二十九難曰其奇經八脈者既不拘於十二經皆何起何經也然督脈者起於下極之腧並於脊裡上至風府入屬於腦下極篡後之屏翳穴即會陰也督行於背自脊裡而上風府督脈穴名入於腦中任脈者起於中極之下以上毛際循腹裡上關元至咽喉上頤循面入目絡舌中極任脈穴名任行於腹自腹裡而上關元任脈穴名升於頭上衝脈者起於氣衝並足陽明之經挾臍上行至胸中而散並足陽明之經素問經絡論作少陰之經舊本誤在骨空論按衝脈起於足陽明之氣衝上會橫骨大赫等十一穴皆足少陰經也帶脈起於季脅回身一周回繞也陽蹺脈者起於跟中循外踝上行入風池也陽蹺足太陽之別起於足太陽之申脈循外踝上行入於足少陽之風池也陰蹺脈者亦起於跟中循內踝上行至咽喉交貫衝脈陰蹺足少陰之別起於足少陰之照海循內踝上至咽喉而交衝脈陽維陰維者維絡於身故陽維起於諸陽會陰維起於諸陰交也陽維陰維維絡於身陽維主一身之表起於諸陽會足太陽之金門也陰維主一身之裡起於諸陰交點少陰之築賓也比於聖人圖設溝渠溝渠滿溢流於深湖故聖人不能拘通也而人脈隆盛入於八脈而不環周溢蓄不能環流灌溉諸經者也故十二經亦不能拘之其受邪氣蓄則腫熱砭射之也八脈者十二經之絡脈也經脈隆盛入於八脈則溢蓄於外不能灌溉諸經故經脈不能拘之其受邪氣感襲則表陽蓄積而生腫熱宜以砭石瀉之也三十難三十難曰奇經之為病何如然陰蹺為病陽緩而陰急陽蹺為病陰緩而陽急沖之為病逆氣而裡急督之為病脊強而厥任之為病其內苦結男子七疝女子瘕聚帶之為病腹滿腰溶溶如坐水中陽維為病苦寒熱陰維為病苦心痛陽維維於陽陰維維於陰陰陽不能自相維則悵然失志溶溶不能自收持此奇經八脈之為病也陰蹺行於腿里病則外緩而內急陽蹺行於腿外病則內緩而外急沖行於身前病則經氣上衝逆氣而裡急督則行於身後病則經脈失榮脊強而身厥任為諸陰之宗陽根下潛蟄藏於此陽泄根拔寒凝氣結男子則為七疝女子則為瘕聚帶脈環腰如帶橫束諸經病則帶脈不束腹滿腰冷溶溶若坐水中陽維主一身之表病則表傷而苦寒熱陰維主一身之裡病則里傷而苦心痛蓋陽維維於諸陽陰維維於諸陰若陰陽不能自相維則悵然失志溶溶不能自收持表裡泄越喪其保障故也難經懸解卷上終
