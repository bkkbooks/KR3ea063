body:
  text: 書新刻黃氏遺書後上書三種昌邑黃坤載先生所著也先生博極群書尤邃於易諸子百家靡不精熟中年偶患目疾頗為醫工所誤乃專致於黃帝岐伯越人仲景四聖之書探賾索隱抉其陰陽升降之理著書十一種今四庫全書存目中所著録者是也先生嫉近代諸醫家離經畔道多逞私説反復辨難闢其乖謬緣是為世詬病故其書屏不傳嘉慶中葉吾鄉先輩張皋聞翰風二先生昆仲同客京師一日皋聞於廠肆廢麓中得先生所著醫書一册以示翰風曰其文駕魏晉上翰風素工醫讀之曰豈特其文其於醫直仲景後一人而已即之廠肆編索他册不可得道光己丑翰風權知山東館陶縣事掖校官張君蘊山昌邑人也得先生所著素靈微蘊傷寒懸解四聖心源長沙藥解傷寒説意金匱懸解録以授翰風館陶鮮刻工翰風乃郵寄其尤要者刻於京師世所傳宛鄰書屋叢書中黃氏遺書四種是也未幾翰風先生歸道山令子仲遠同年承先志將南歸丐其友董子遠孝廉楊用明外翰兼程赴昌邑擬盡録先生所著書值先生子姓亦有喪子遠用明窮一日夜之力僅録得四聖懸樞玉楸藥解以報仲遠邇年徐受衡侍郎刻於閩歐陽曉岑觀察刻於皖彭器之觀察刻於蜀世所稱黃氏遺書八種皆轉輾從仲遠録出者也而素問靈樞難經三懸解卒鮮傳本近更喪亂昌邑亦經兵燹先生之書將不可過問矣今歲正月吾鄉馮賡廷國學正於廠肆中得先生生平著述鈔本數册則三懸解具在焉賡廷固精於醫而有志於振興斯道者既幸先生之醫書得此而大備而此三書者世無刻本急思公諸同好以廣其傳聞崇朴山將軍藏宋刻素問靈樞新校正本假以校讎爰付剞劂而屬曾向識其緣起如此翰風先生嘗曰醫學盛於上古衰於後世蓋自劉朱之言盈天下舉世惟知滋陰熄火之為急以此毒天下而民從之誠咄咄怪事先生所為表闡四聖之旨而於近代之邪説詖辭拒之必力也孟子曰豫豈好辨哉豫不得已也先生有焉或謂先生論醫偏於扶陽考之素問生氣通天論重言陽氣者五傷寒論少陰篇曰少陰負趺陽者為順也陽貴陰賤古訓昭然先生豈臆説哉是故欲知醫必盡通四聖之書欲通四聖之書必先讀先生之書今先生之書十一種俱刊行於世是天心之仁愛斯人不忍以斯人之疾病生死終聽之於二三庸妄之説而特啓先生以昌明四聖之學後之君子舉金元以來謬種流傳諸書付之一炬獨守先生之言與晉唐諸名醫參互考訂以直接四聖心傳庶幾民無夭札世登壽域此則先生之志亦即賡廷刊是書之志也夫同治十一年秋八月陽湖趙曾向謹書
