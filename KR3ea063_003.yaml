body:
  text: 卷下三十一難三十一難曰營氣之行常與衛氣相隨不然經言人受氣於谷谷入於胃以傳於肺五臟六腑皆以受氣其清者為營濁者為衛營行脈中衛行脈外營周不休五十而復大會陰陽相貫如環無端故知營衛相隨也此引靈樞營衛生會文營自平旦起於手太陰之氣口五十度而復會於氣口衛氣自平旦起於足太陽之睛明五十度而復會於睛明本不同道曰相隨者言其並行於經中也若宗氣則與營氣相隨耳胸中大氣曰宗氣義詳靈樞營氣衛氣諸篇三十二難三十二難曰五臟俱等而心肺俱在膈上者何也然心者血肺者氣血為營氣為衛相隨上下謂之營衛通行經絡營周於外故令心肺在膈上也在臟腑曰氣血在經絡曰營衛三十三難三十三難曰肝青象木肺白象金肝得水而沉木得水而浮肺得水而浮金得水而沉其義何也然夫肝者非為純木也乙角也庚之柔大言陰與陽小言夫與婦釋其微陽而吸其微陰之氣其意樂金又行陰道多故令肝得水而沉也肺者非為純金也辛商也丙之柔大言陰與陽小言夫與婦釋其微陰婚而就火其意樂火又行陽道多故令肺得水而浮也肺熱而復沉肝熱而復浮者何也故知辛當歸庚乙當歸甲也乙與庚合其意樂金又自水位上升是行於陰道多也故肝得水沉辛與丙合其意樂火又自火位下降是行於陽道多也故肺得水浮及至肺熱而復沉肝熱而復浮則是辛金終當歸庚乙木終當歸甲也三十四難三十四難曰五臟各有聲色臭味皆可曉知以不然十變言肝色青其臭臊其味酸其聲呼其液泣心色赤其臭焦其味苦其聲言其液汗脾色黃其臭香其味甘其聲歌其液涎肺色白其臭腥其味辛其聲哭其液涕腎色黑其臭腐其味鹹其聲呻其液唾是五臟聲色臭味也肝主五色心主五臭脾主五味肺主五聲腎主五液五臟有七神各何所主也然臟者人之神氣所舍藏也故肝藏魂肺藏魄心藏神脾藏意與智腎藏精與志也魂魄神意智精志是謂七神三十五難三十五難曰五臟各有所腑皆相近而心肺獨去大腸小腸遠者何謂也然經言心營肺衛通行陽氣故居在上大腸小腸傳陰氣而下故居在下所以相去而遠也心肺行其精華故居於上二腸傳其糟粕故居於下因而相去之遠也又謂腑者皆陽也清淨之處今大腸小腸胃與膀胱皆受不淨其義何也然諸腑者謂是非也經言小腸者受盛之腑也大腸者傳瀉行道之腑也膽者清淨之腑也胃者水穀之腑膀胱者津液之腑一腑猶無兩名故知非也小腸者心之府大腸者肺之府胃者脾之府膽者肝之府膀胱者腎之腑小腸為赤腸大腸為白腸膽者為青腸胃者為黃腸膀胱者為黑腸下焦所治也謂是非也謂其如是則非也經素問十二臟相使王冰改為靈蘭祕典據內經所言清淨之腑唯有膽也其餘皆受水穀而傳渣滓何得清淨一腑並無兩名經之所言即今之所稱故知此謂非也蓋腑者五臟之府庫也諸腑皆謂之腸是腸則傳導糟粕而下悉屬下焦所治下為濁陰故受不淨也三十六難三十六難曰臟各有一耳腎獨有兩者何也然腎兩者非皆腎也其左者為腎右者為命門命門者諸精神之所舍原氣之所繫也男子以藏精女子以系胞故知腎有一也火降於右水升於左故左者為腎右者為命門命門者神根於此精藏於中是一身原氣之所繫也男子以之藏精女子以之系胞素問腹中論胞絡者繫於腎是也三十七難三十七難曰臟唯有五腑獨有六者何也然所以腑有六者謂三焦也有原氣之別焉主持諸氣有名而無形其經屬手少陽此外府也故言腑有六焉腎為原氣之正三焦為原氣之別外府謂在諸腑之外也按靈樞本臟曰三焦膀胱厚三焦膀胱薄是有形也與此不同三十八難三十八難曰經言腑有五臟有六者何也然六腑者止有五腑也然五臟亦有六臟者謂腎有兩臟也其左為腎右為命門命門者謂精神之所舍也男子以藏精女子以系胞其氣與腎通故言臟有六也腑有五者何也然五臟各一腑三焦亦是一腑然不屬於五臟故言腑有五焉其氣與腎通命門之陽氣通於腎也三十九難三十九難曰肝獨有兩葉以何應也然肝者東方木也木者春也萬物之始生其尚幼小意無所親去太陰尚近離太陽尚遠猶有兩心故令有兩葉亦應木葉也心為陽中之太陽腎為陰中之太陰見素問六節藏象論四十難四十難曰經言肝主色心主臭脾主味肺主聲腎主液鼻者肺之候而反知香臭耳者腎之候而反聞聲其意何也然肺者西方金也金生於己己者南方火火者心心主臭故令鼻知香臭腎者北方水也水生於申申者西方金金者肺肺主聲故令耳聞聲心主臭火也肺金開竅於鼻而內有己火故能知臭肺主聲金也腎水開竅於耳而內有申金故能聞聲四十一難四十一難曰五臟之氣於何發起通於何許可曉以不然五臟者嘗內閲於上七竅也故肺氣通於鼻鼻和則知香臭矣肝氣通於目目和則知黑白矣脾氣通於口口和則知穀味矣心氣通於舌舌和則知五味矣腎氣通於耳耳和則知五音矣五臟不和則七竅不通六腑不和則留結為聚嘗內閲於上七竅也舊訛作當上閲於九竅也以靈樞改正之張潔古認真九竅添三焦之氣通於喉喉和則聲鳴矣二句謬妄不通經言氣獨行於五臟不榮於六腑者何也然夫氣之行如水之流不得息也故陰脈榮於五臟陽脈榮於六腑如環無端莫知其紀終而復始其流溢之氣內溫於臟腑外濡於腠理其流溢之氣舊訛作而不覆溢人氣依靈樞正之邪在六腑則陽脈不和陽脈不和則氣留之氣留之則陽脈盛矣邪在五臟則陰脈不和陰脈不和則血留之血留之則陰脈盛矣陰氣太盛則陽氣不得相榮也故曰格陽氣太盛則陰氣不得相榮也故曰關陰陽俱盛不得相榮也故曰關格關格者不得盡其命而死矣氣無獨行而不相榮者其不相榮者邪客之也陰盛格陽於外曰格陽盛關陰於內曰關此篇全引靈樞脈度文四十二難四十二難曰人腸胃長短受水穀多少各幾何然唇至齒長九分口廣二寸半齒以後至會厭深三寸半大容五合舌重十兩長七寸廣二寸半咽門重十兩廣二寸半至胃長一尺六寸喉嚨重十二兩廣二寸長一尺二寸九節胃重二斤十四兩紆曲屈伸長二尺六寸大一尺五寸徑五寸容谷二斗水一斗五升小腸重二斤十四兩長三丈二尺廣二寸半徑八分分之少半左回疊積十六曲容谷二斗四升水六升三合合之大半大腸重二斤十二兩長二丈一尺廣四寸徑一寸半當臍右回疊積十六曲盛谷一斗水七升半肛門重十二兩大八寸徑二寸大半長二尺八寸受谷九升三合八分合之一膀胱重九兩二銖縱廣九寸受溺九升八合此腸胃長短受水穀之數也會厭在喉嚨上所以分司氣管食管之開闔者肛門謂廣腸下至肛門即直腸也此引靈樞腸胃文肝重四斤四兩左三葉右四葉凡七葉主藏魂心重十二兩中有七孔三毛盛精汁三合主藏神脾重二斤三兩扁廣三寸長五寸有散膏半斤主裹血溫五臟主藏意肺重三斤三兩六葉兩耳凡八葉主藏魄腎有兩枚重一斤二兩主藏志膽在肝之短葉間重三兩二銖盛精汁三合魂神意魄精是謂五神四十三難四十三難曰人不食飲者七日而死何也然胃大一尺五寸徑五寸長二尺六寸橫屈受水穀三斗五升其中長留谷二斗水一斗五升小腸大二寸半徑八分分之少半長三丈二尺受谷二斗四升水六升三合合之大半回腸大四寸徑一寸半長二丈一尺受谷一斗水七升半廣腸大八寸徑二寸半長二尺八寸受谷九升三合八分合之一腸胃凡長五丈八尺四寸合受水穀九斗二升一合八分合之一此腸胃所受水穀之數也此段舊誤在四十二難中依靈樞正之人胃中常留谷二斗水一斗五升平人日再至圊一行二升半日中五升七日五七三斗五升而水穀盡矣故平人不食飲七日而死者水穀津液俱盡即死矣此篇全引靈樞平人絶谷文四十四難四十四難曰七衝門何在然唇為飛門齒為戶門會厭為吸門胃為賁門太倉下口為幽門大腸小腸會為闌門下極為魄門故曰七衝門也沖要也賁與奔同胃之上口水穀下奔之路也太倉胃也幽門胃之下口即小腸上口闌門小腸下口即大腸上口下極謂會陰穴在前後二陰之間會陰之後即魄門二十九難督脈起於下極之腧即此四十五難四十五難曰經言八會者何也然腑會太倉臟會季脅筋會陽陵泉髓會絶骨血會膈俞骨會大杼脈會太淵氣會三焦外一筋直兩乳內也熱病在內者取其會之氣穴也太倉胃也地當任脈之中脘胃為六腑之長故腑會於此季脅足厥陰之章門脾之募也脾為五臟之長故臟會於此陽陵泉足少陽穴肝膽主筋故筋會於此絶骨外踝上光骨當足少陽之懸鐘膈俞足太陽穴大杼亦足太陽穴在大椎上太淵手太陰穴三焦上焦地在外一筋直兩乳之內當任脈之膻中宗氣在此三焦之上原也熱病在內者取其所會之氣穴以瀉其熱也四十六難四十六難曰老人臥而不寐少壯寐而不寤者何也然經言少壯者血氣盛肌肉滑氣道通營衛之行不失其常故晝日精夜不寤老人血氣衰肌肉不滑營衛之道澀故晝日不能精夜不能寐也故知老人不能寐也靈樞營衛生會篇四十七難四十七難曰人面獨能耐寒者何也然人頭者諸陽之會也諸陰脈皆至頸胸中而還獨諸陽脈皆上至頭耳故令面耐寒也此難靈樞邪氣臟腑病形篇其面不衣一段足之三陰自足走胸其上者至頸而止手之三陰自胸走手手少陰上挾咽手之三陽自手走頭足之三陽自頭走足惟手足三陽皆上至頭是諸陽之所會也四十八難四十八難曰人有三虛三實何謂也然有脈之虛實有病之虛實有診之虛實也脈之虛實者濡者為虛緊牢者為實病之虛實者出者為虛入者為實言者為虛不言者為實緩者為虛急者為實診之虛實者濡者為虛牢者為實癢者為虛痛者為實外痛內快則為外實內虛內痛外快為內實外虛自內而外出者為虛內先損傷也自外而內入者為實外先感襲也緩者氣鬆緩也急者氣迫急也四十九難四十九難曰有正經自病有五邪所傷何以別之然憂愁思慮則傷心形寒飲冷則傷肺恚怒氣逆上而不下則傷肝飲食勞倦則傷脾久坐濕地強力入水則傷腎是正經自病也久坐濕地則濕土賊水強力汗出入水水入汗孔化濕亦能賊水故皆傷腎何謂五邪然有中風有傷暑有飲食勞倦有傷寒有中濕此之謂五邪五邪皆自外至者假令心病何以知中風得之然其色當赤何以言之肝主色自入為青入心為赤入脾為黃入肺為白入腎為黑肝為心邪故知當赤色也其病身熱脅下滿痛其脈浮大而弦肝脈行於兩脅心脈浮大肝脈弦何以知傷暑得之然當惡臭何以言之心主臭自入為焦臭入脾為香臭入肺為腥臭入腎為腐臭入肝為臊臭故知心病傷暑得之當惡臭也其病身熱而煩心痛其脈浮大而散心脈浮大而散何以知飲食勞倦得之然當喜苦味也虛為不欲食實為欲食何以言之脾主味自入為甘入肺為辛入腎為咸入肝為酸入心為苦故知脾邪入心為喜苦味也其病身熱而體重嗜臥四肢不收其脈浮大而緩土濕則體重脾倦則嗜臥中氣不運四肢失稟則縱緩不收脾脈緩何以知傷寒得之然當譫言妄語何以言之肺主聲自入為哭入腎為呻入肝為呼入心為言入脾為歌故知肺邪入心為譫言妄語也其病身熱灑灑惡寒甚則喘咳其脈浮大而澀肺脈澀何以知中濕得之然當喜汗出不可止何以言之腎主液自入為唾入肝為泣入心為汗入脾為涎入肺為涕故知腎邪入心為汗出不可止也其病身熱小腹痛足脛寒而逆其脈沉濡而大此五邪之法也腎脈沉濡五十難五十難曰病有虛邪有實邪有賊邪有微邪有正邪何以別之然從後來者為虛邪從前來者為實邪從所不勝來者為賊邪從所勝來者為微邪自病為正邪何以言之假令心病中風得之為虛邪傷暑得之為正邪飲食勞倦得之為實邪傷寒得之為微邪中濕得之為賊邪心為火假令心病中風木邪火所由生也是自後來傷暑火邪是為自病飲食勞倦土邪火之所由生也是從前來傷寒金邪是從所勝來中濕水邪是從所不勝來也五十一難五十一難曰病有欲得溫者有欲得寒者有欲見人者有不欲見人者而各不同病在何臟腑也然病欲得寒而欲見人者病在腑也病欲得溫而不欲見人者病在臟也何以言之腑者陽也陽病欲得寒又欲見人臟者陰也陰病欲得溫又欲閉戶獨處惡聞人聲故以別知臟腑之病也陽病熱陰病寒陽病動陰病靜其性然也五十二難五十二難曰腑臟發病根本等不然不等也其不等奈何臟病者止而不移其病不離其處腑病者倣佛賁響上下流行居處無常故以此知臟腑根本不同也倣佛者遊移無定之象賁響賁走而鳴轉也五十三難五十三難曰病有積有聚何以別之然積者陰氣也聚者陽氣也故陰沉而伏陽浮而動氣之所積名曰積氣之所聚名曰聚積者五臟所生聚者六腑所成積者陰氣也其發有常處其痛不離其部上下有所終始左右有所窮處聚者陽氣也其始發無根本上下無所留止其痛無常處故以是別知積聚也此申明上章之義五十四難五十四難曰五臟之積各有名乎以何月何日得之然肝之積名曰肥氣在左脅下如覆杯有頭足久不愈令人發咳逆痎瘧連歲不已以季夏戊己日得之何以言之肺病傳肝肝當傳脾脾季夏適王王者不受邪肝復欲還肺肺不肯受故留結為積故知肥氣以季夏戊己日得之肝位在左脅肝膽同氣咳逆膽火逆刑肺金也痎瘧膽火閉於重陰之中鼓動欲出而陰邪外束故生寒栗及其鬱蒸透發則寒變而為熱也心之積名曰伏梁起臍上大如臂上至心下久不愈令人病煩心以秋庚辛日得之何以言之腎病傳心心當傳肺肺秋適王王者不受邪心復欲還腎腎不肯受故留結為積故知伏梁以秋庚辛日得之心位在臍上脾之積名曰痞氣在胃脘覆大如盤久不愈令人四肢不收發黃疸飲食不為肌膚以冬壬癸日得之何以言之肝病傳脾脾當傳腎腎以冬適王王者不受邪脾復欲還肝肝不肯受故留結為積故知痞氣以冬壬癸日得之脾位在中脘肺之積名曰息賁在右脅下覆大如杯久不已令人灑淅寒熱喘咳發肺壅以春甲乙日得之何以言之心病傳肺肺當傳肝肝以春適王王者不受邪肺復欲還心心不肯受故留結為積故知息賁以春甲乙日得之肺位在右脅息賁喘息奔逆也腎之積名曰賁豚發於少腹上至心下若豚狀或上或下無時久不已令人喘逆骨痿少氣以夏丙丁日得之何以言之脾病傳腎腎當傳心心以夏適王王者不受邪腎復欲還脾脾不肯受故留結為積故知賁豚以夏丙丁日得之此五積之要法也腎位在少腹賁豚發作狀如豚奔上至心下痛苦欲死故曰賁豚五十五難五十五難曰經言七傳者死間臟者生何謂也然七傳者傳其所勝也間臟者傳其子也何以言之假令心病傳肺肺傳肝肝傳脾脾傳腎腎傳心一臟不再傷故言七傳者死也間臟者傳其所生也假令心病傳脾脾傳肺肺傳腎腎傳肝肝傳心是子母相傳周而復始如環無端故言生也間臟者不傳所勝隔二臟而傳其所生也五十六難五十六難曰臟病難治腑病易治何謂也然臟病所以難治者傳其所勝也腑病易治者傳其子也與七傳間臟同法也臟病之難治者傳其所勝也腑病之易治者傳其所生也臟病深故傳所勝腑病淺故傳所生蓋平人無病皆傳所生腑病輕微未至乖常失度彼此克賊故傳其所生與平人相同也五十七難五十七難曰泄凡有幾皆有名不然泄凡有五其名不同有胃泄有脾泄有大腸泄有小腸泄有大瘕泄名曰後重胃泄者飲食不化色黃脾泄者腹脹滿泄注食即嘔吐逆大腸泄者食已窘迫大便色白腸鳴切痛小腸泄者溲而便膿血少腹痛大瘕泄者裡急後重數至圊而不便莖中痛此五泄之法也胃泄者甲木之克戊土也胃以受盛為職乘以甲木之邪胃腑郁迫水穀莫容則生吐泄傷寒陽明少陽之泄皆此證也脾泄者乙木之賊己土也脾土濕寒不能蒸水化氣水穀並下脾濕愈滋土陷木遏肝氣不達風木沖決開其後竅則生泄注內傷之泄皆此證也食則嘔吐逆者脾陷則胃逆也大腸泄者金斂而木不泄也乙木陷於大腸上達無路欲沖後竅而出而大腸斂之不得暢泄故窘迫欲後腸鳴而痛切也大便白者金色也小腸泄者寒水鬱其丙火也小腸以丙火而化寒水水寒生泄不過大便溏注而已不作膿血也病則丙火不化寒水鬱於濕土之中丙火不化寒水因於土濕內熱淫蒸膿血腐化寒水絶其上源故溲溺淋澀風木鬱沖故小腹痛作也大瘕泄者水土之郁陷也水土濕寒陰氣凝結瘕塊纍生乙木不得溫升陷沖後竅而疏泄失政未能順下故溲便頻數裡急後重而糞溺艱澀不利也泄雖有五唯胃泄為膽胃病其四皆脾肝之證而癸水之寒乃其根本也五十八難五十八難曰傷寒有幾其脈有變不然傷寒有五有中風有傷寒有濕溫有熱病有溫病其所苦各不同中風風傷衛也傷寒寒傷營也詳仲景傷寒濕溫中濕而發熱者也熱病暑病也即仲景暍病溫病春月而病感者也素問熱病即溫病之發於夏月者評熱病論先夏至者為病溫後夏至者為病暑是也與此不同中風之脈陽浮而滑陰濡而弱濕溫之脈陽濡而弱陰小而急傷寒之脈陰陽俱甚而緊澀熱病之脈陰陽俱浮浮之而滑沉之散澀溫病之脈行在諸經不知何經之動也各隨其經之所在而取之溫病各經不同行在於諸經之中不知何經之動也各隨其經之所在而取之溫病不過六經而經隨日傳六日而盡須逐日診之難以預定也溫病一日太陽二日陽明三日少陽四日太陰五日少陰六日厥陰法詳素問熱論傷寒有汗出而愈下之而死者有汗出而死下之而愈者何也然陽虛陰盛汗出而愈下之即死陽盛陰虛汗出而死下之而愈陽虛陰盛下則亡陽故可汗愈陽盛陰虛汗則亡陰故可下愈寒熱之病候之如何也然皮寒熱者皮不可近席毛髮焦鼻稿不得汗肌寒熱者皮膚痛唇舌稿無汗骨寒熱者病無所安汗注不休齒本稿痛此段引靈樞寒熱病文五十九難五十九難曰狂癲之病何以別之然狂之始發少臥而不飢自高賢也自辨智也自貴倨也妄笑好歌樂妄行不休是也癲病始發意不樂直視僵仆其脈三部陰陽俱盛是也此引靈樞癲狂文六十難六十難曰頭心之病有厥痛有真痛何謂也然手三陽之脈受風寒伏留而不去者則名厥頭痛入連在腦者名真頭痛其五臟相干名厥心痛其痛甚但在心手足清者即名真心痛其真心痛者旦發夕死夕發旦死此難靈樞厥病厥病真頭痛頭痛甚腦盡痛手足寒至節死不治六十一難六十一難曰經言望而知之謂之神聞而知之謂之聖問而知之謂之工切而知之謂之巧何謂也然望而知之者望見其五色以知其病聞而知之者聞其五音以別其病問而知之者問其所欲五味以知其病所起所在切脈而知之者診其寸口視其虛實以知病在何臟腑也經言以外知之曰聖以內知之曰神此之謂也以外知之驗其外而知之也以內知之洞其內而知之也六十二難六十二難曰臟井滎有五腑獨有六者何謂也然腑者陽也三焦行於諸陽故置一腧名曰原所以腑有六者亦與三焦共一氣也五臟五腧井滎俞經合也六腑六腧井滎俞原經合也詳見靈樞本輸腑有六腧者以五腑之外又有三焦一腑故多置一原穴以配之此亦與三焦共一氣也六十三難六十三難曰十變言五臟六腑滎合皆以井為始者何謂也然井者東方木也萬物之始生故蚑行喘息蜎飛蠕動當生之物莫不以春生故歲數始於春日數始於甲故以井為始也滎合以井為始義詳靈樞本輸蚑行喘息蜎飛蠕動謂行息飛動一切諸蟲也六十四難六十四難曰十變又言陰井木陽井金陰滎火陽滎水陰俞土陽俞木陰經金陽經火陰合水陽合土陰陽皆不同其意何也然是剛柔之事也陰井乙木陽井庚金陽井庚庚者乙之剛也陰井乙乙者庚之柔也乙為木故言陰井木也庚為金故言陽井金也余皆仿此陰井木陽井金義詳靈樞本輸六十五難六十五難曰經言所出為井所入為合其法奈何然所出為井井者東方春也萬物始生故言所出為井所入為合合者北方冬也陽氣入藏故言所入為合也萬物出於春井之義也陽氣入於冬合之義也六十六難六十六難曰經言肺之原出於太淵心之原出於大陵肝之原出於太衝脾之原出於太白腎之原出於太溪少陰之原出於兌骨膽之原出於丘墟胃之原出於衝陽三焦之原出於陽池膀胱之原出於京骨大腸之原出於合谷小腸之原出於腕骨十二經皆以俞為原者何也然五臟俞者三焦之所行氣之所留止也三焦所行之俞為原者何也然臍下腎間動氣者人之生命也十二經之根本也故名曰原三焦者原氣之別使也主通行三氣經歷於五臟六腑原者三焦之尊號也故所止輒為原五臟六腑之有病者皆取其原也肺之原出於太淵五句義見靈樞九針十二原此皆五臟之俞穴也左右各一共十穴連膏之原肓之原膏之原出於鳩尾肓之原出於脖胦合為十二原少陰之原出於兌骨謂神門也手少陰無腧所謂心之原出於大陵者皆手厥陰之腧也義見靈樞逆順肥瘦舊本誤在邪客故此補少陰之原句膽之原出於丘墟六句義見靈樞本輸此皆六腑之原穴也十二經皆以俞為原者謂九針十二原中皆以五臟之俞穴為原非謂六腑也以五臟之俞乃三焦之所行是其氣所留止故稱曰原蓋腎間動氣一身之原氣也三焦者腎中原氣之別使行於上下三焦經歷五臟六腑之俞穴其所留止輒謂之原以其原於動氣間而得名也六十七難六十七難曰五臟六腑各有井滎俞經合皆何所主然經言所出為井所流為滎所注為俞所行為經所入為合井主心下滿滎主身熱俞主體重節痛經主喘咳寒熱合主逆氣而泄此五臟六腑井滎俞經合所主病也六十八難六十八難曰五臟募皆在陰俞皆在陽者何謂也然陰病行陽陽病行陰故令募在陰俞在陽也五臟之募皆在腹肝之募期門心之募巨闕脾之募章門肺之募中府腎之募京門俞皆在背總出於足太陽之經背為陽腹為陰陰病必行於陽陽病必行於陰故令募在於腹俞在於背也以募者臟中陽氣之所結也是以陽病行於陰俞者臟中陰氣之所輸也是以陰病行於陽也六十九難六十九難曰經言虛者補之實者瀉之不虛不實以經取之何謂也然虛者補其母實者瀉其子當先補之然後瀉之不實不虛以經取之者是正經自生病不中他邪也當自取其經故言以經取之經靈樞經脈自取其經取其本經不取其子母也七十難七十難曰經言春夏刺淺秋冬刺深者何謂也然春夏者陽氣在上人氣亦在上故當淺取之秋冬者陽氣在下人氣亦在下故當深取之經素問四時刺逆從論諸篇春夏各致一陰秋冬各致一陽者何謂也然春夏溫必致一陰者初下針沉之至腎肝之部得氣引而持之陰也秋冬寒必致一陽者初內針淺而浮之至心肺之部得氣推而內之陽也是謂春夏必致一陰秋冬必致一陽也腎肝之部筋骨也心肺之部皮脈也七十一難七十一難曰經言刺營無傷衛刺衛無傷營何謂也然針陽者臥針而刺之刺陰者先以左手攝按所針滎俞之處氣散乃內針是謂刺營無傷衛刺衛無傷營也衛為陽營為陰刺衛者臥針而刺之則不傷營衛行脈外針入淺也刺營者先以左手攝按所針滎俞之處衛氣開散乃內針則不傷衛營行脈中針入雖深而未嘗及衛也七十二難七十二難曰經言能知迎隨氣可令調調氣之方必在陰陽何謂也然所謂迎隨者知營衛之流行經脈之往來也隨其逆順而取之故曰迎隨調氣之方必在陰陽者知其內外表里隨其陰陽而調之故曰調氣之方必在陰陽經靈樞終始九針十二原往者為逆來者為順明知逆順正行無問迎而奪之惡得無虛追而濟之惡得無實迎之隨之以意和之是也七十三難七十三難曰諸井者肌肉淺薄氣少不足使也刺之奈何然諸井者木也滎者火也火者木之子當刺井者以滎瀉之故經曰補者不可以為瀉瀉者不可以為補此之謂也諸井穴在手足指端經脈初發肌肉淺薄氣少不足使用當刺者瀉其滎穴以滎火者井木之子所謂實者瀉其子也井穴宜補不宜瀉是故經云補者不可以為瀉瀉者不可以為補也七十四難七十四難曰經言春刺井夏刺滎季夏刺俞秋刺經冬刺合者何也然春刺井者邪在肝夏刺滎者邪在心季夏刺俞者邪在脾秋刺經者邪在肺冬刺合者邪在腎其肝心脾肺腎而繫於春夏秋冬者何也然五臟一病輒有五也假令肝病色青者肝也臊臭者肝也喜酸者肝也喜呼者肝也喜泣者肝也其病衆多不可盡言也四時有數而並繫於春夏秋冬者針之要妙在於秋毫者也靈樞刺法冬刺井春刺滎夏刺俞長夏刺經秋刺合與此不同井為木春刺井者以其邪在肝木也滎為火夏刺滎者以其邪在心火也俞為土季夏刺俞者以其邪在脾土也經為金秋刺經者以其邪在肺金也合為水冬刺合者以其邪在腎水也然五臟一病輒有五條未可拘也假令肝病色青者肝也肝主色也臊臭者肝也而中有心病心主臭入肝為臊也喜酸者肝也而中有脾病脾主味入肝為酸也喜呼者肝也而中有肺病肺主聲入肝為呼也喜泣者肝也而中有腎病腎主液入肝為泣也其病衆多不可盡言雖四時有數並繫於春夏秋冬刺法系於四時而針之要妙則在於秋毫之間其變無窮也七十五難七十五難曰經言東方實西方虛瀉南方補北方何謂也然金木水火土當更相平東方木也西方金也木欲實金當平之火欲實水當平之土欲實木當平之金欲實火當平之水穀實土當平之東方者肝也則知肝實西方者肺也則知肺虛瀉南方火補北方水南方火火者木之子也北方水水者木之母也水勝火子能令母實母能令子虛故瀉火補水欲令金得平木也經曰不得治其虛何問其餘此之謂也火者木之子子能令母實故瀉其子水者木之母母能令子虛故補其母瀉火補水使木氣不實則金得平之矣七十六難七十六難曰何謂補瀉當補之時何以取氣當瀉之時何以置氣然當補之時從衛取氣當瀉之時從營置氣其陽氣不足陰氣有餘當先補其陽而後瀉其陰陰氣不足陽氣有餘當先補其陰而後瀉其陽營衛通行此其要也置舍置也衛氣收斂故從衛取氣營性疏泄故從營置氣七十七難七十七難曰經言上工治未現中工治已病者何謂也然所謂治未病者見肝之病則知肝當傳之於脾故先實其脾氣無令得受肝之邪也故曰治未病焉中工治已病者見肝之病不曉相傳但一心治肝故曰治已病也肝病傳脾克其所勝也七十八難七十八難曰針有補瀉何謂也然補瀉之法非必呼吸出內針也知為針者信其左不知為針者信其右當刺之時必先以左手厭按所針之處彈而怒之爪而下之其氣之來如動脈之狀順針而刺之得氣推而內之是謂補動而伸之是謂瀉不得氣乃與男外女內不得氣是謂十死不治也補者候呼內針候吸出針瀉者候吸內針候呼出針此補瀉之恆法耳持針右手也而刺法之妙全在左手故知為針者信其左手不知為針者信其右手當刺之時必先以左手厭同壓按所針之處以指彈而怒之以爪引而下之以致其氣其氣之來如動脈之狀然後順針而刺之此方是右手事耳針下得氣推其針而內入之是謂補動其針而引伸之是謂瀉若不得氣乃與男外女內以求之仍不得氣是謂十死不治也七十九難七十九難曰經言迎而奪之安得無虛隨而濟之安得無實虛之與實若得若失實之與虛若有若無何謂也然迎而奪之者瀉其子也隨而濟之者補其母也假令心病瀉手心主俞是謂迎而奪之者也補手心主井是謂隨而濟之者也所謂實之與虛者濡牢之意也氣來實牢者為得濡虛者為失故曰若得若失也經靈樞九針十二原心為火滎亦為火瀉手心主俞土火之子也是謂迎而奪之補手心主井木火之母也是謂隨而濟之手少陰無俞故取手心主八十難八十難曰經言有見如入有見如出者何謂也然所謂有見如入者謂左手見氣來至乃內針針入見氣盡乃出針是謂有見如入有見如出也有見如入有見如出有所見而入有所見而出也八十一難八十一難曰經言無實實無虛虛損不足而益有餘是寸口脈耶將病自有虛實也其損益奈何然是非謂寸口脈也謂病自有虛實也假令肝實而肺虛肝者木也肺者金也金木當更相平當知金平木假令肺實故知肝虛微少氣用針不補其肝而反重實其肺故曰實實虛虛損不足而益有餘此者中工之所害也肺金克肝木者常也假令肝實而肺虛則當助金以平木假令肺實則肝氣必虛矣若不補其肝而反實其肺是實其實虛其虛損不足而益有餘若此者乃中工之所害也
